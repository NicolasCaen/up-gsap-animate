name: Release Plugin

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: |
          npm install
          npm install @wordpress/scripts@30.8.1 --save-dev
        
      - name: Build
        run: npm run build
        
      - name: Create plugin archive
        run: |
          # Create a clean directory for the plugin
          mkdir up-gsap-animate
          
          # Copy only the necessary files
          cp -r build up-gsap-animate/
          cp webpack.config.js up-gsap-animate/
          cp *.php up-gsap-animate/
          cp readme.txt up-gsap-animate/
          cp LICENSE up-gsap-animate/
          cp package.json up-gsap-animate/
          cp README.md up-gsap-animate/
          
          # Create ZIP file
          zip -r up-gsap-animate.zip up-gsap-animate
          
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: up-gsap-animate.zip
